<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COBOL Map</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
    --clean: #2f8f5b; --errors: #c48a12; --crash: #c2412d; --queued: #a9a8a2; --accent: #3a5bd9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .where { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  .badge.running::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; vertical-align: 1px; }
  @keyframes pulse { 50% { opacity: .25; } }
  nav { display: flex; gap: 4px; padding: 0 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { border: 0; background: none; padding: 10px 12px; font: inherit; color: var(--muted);
    border-bottom: 2px solid transparent; cursor: pointer; }
  nav button.active { color: var(--text); border-bottom-color: var(--text); }
  nav button .count { font-size: 12px; color: var(--muted); margin-left: 4px; }
  main { padding: 20px 24px 60px; max-width: 1400px; }
  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  section.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kpi .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #ecebe7; margin: 4px 0 8px; }
  .bar span { display: block; height: 100%; transition: width .4s; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #fafaf8; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .chip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .chip.clean { background: var(--clean); } .chip.errors { background: var(--errors); }
  .chip.crash { background: var(--crash); } .chip.queued { background: var(--queued); } .chip.parsing { background: #8ea2ee; }
  .chip.parsing { animation: pulse 1.2s infinite; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .filters button.on { border-color: var(--text); }
  a, .link { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover, .link:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .ok { color: var(--clean); } .bad { color: var(--crash); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  svg text { font: 11px var(--mono); }
  .matrix { overflow: auto; max-height: 70vh; }
  .matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-family: var(--mono); font-weight: 500; padding: 6px 4px; }
  .matrix td.cell { text-align: center; font-family: var(--mono); font-size: 11px; padding: 4px; cursor: pointer; min-width: 26px; }
  .cell.r { background: #e3efe7; } .cell.w { background: #f8e5c4; } .cell.rw { background: #f3d1c9; }
  .matrix td.rowname { font-family: var(--mono); position: sticky; left: 0; background: var(--panel); }
  .wave { margin-bottom: 18px; }
  .wave h3 { font-size: 14px; margin: 0 0 8px; }
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .unit { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fcfcfb; }
  .unit .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .unit .name { font-weight: 600; margin: 2px 0 6px; }
  .unit .row { font-size: 12.5px; margin-top: 3px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 92vw); background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.06); overflow: auto; padding: 18px 22px; z-index: 10; display: none; }
  .drawer.open { display: block; }
  .drawer .close, .modal .close { float: right; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
  .tree { font-family: var(--mono); font-size: 12.5px; }
  .tree details { margin-left: 14px; } .tree summary { cursor: pointer; }
  .tree .leaf { margin-left: 28px; }
  .modal { position: fixed; inset: 0; background: rgba(20,20,18,.35); display: none; z-index: 20; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal .box { background: var(--panel); border-radius: 8px; width: min(900px, 94vw); max-height: 84vh; overflow: auto; padding: 14px 18px; }
  pre.source { margin: 8px 0 0; font: 12.5px/1.5 var(--mono); }
  pre.source > span { display: block; } pre.source .hl { background: #fff2b8; }
  pre.source .ln { color: var(--muted); display: inline-block; width: 4.5em; user-select: none; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .diffs { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>COBOL Map</h1>
  <div class="where" id="where"></div>
  <span class="badge" id="status">loading</span>
  <span class="muted" id="updated" style="font-size:12px"></span>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
const TABS = [["progress", "Progress"], ["errors", "Errors"], ["programs", "Program Map"], ["data", "Data Map"], ["backlog", "Backlog"]];
const COLORS = { clean: "var(--clean)", errors: "var(--errors)", crash: "var(--crash)", queued: "var(--queued)", parsing: "#8ea2ee" };
let state = null, lastJson = "", tab = location.hash.slice(1) || "progress";
let fileFilter = "all", openCause = null, storeFilter = "all", showCandidates = false;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = (xs, f) => xs.reduce((a, x) => a + (f(x) || 0), 0);
const fmtTime = t => t ? new Date(t * 1000).toLocaleString() : "";
const fmtDur = s => s == null ? "" : s < 60 ? `${s.toFixed(0)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
const link = (text, abs, line) => abs ? `<span class="link mono" data-src="${esc(abs)}" data-line="${line}">${esc(text)}</span>` : esc(text);
const where = (path, abs, line) => abs ? link(`${path}:${line}`, abs, line) : "";

async function refresh() {
  try {
    const text = await (await fetch("api/state")).text();
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
    if (text !== lastJson) { lastJson = text; state = JSON.parse(text); render(); }
  } catch (e) { document.getElementById("status").textContent = "disconnected"; }
  const running = state && state.runs[0] && state.runs[0].status === "running";
  setTimeout(refresh, running ? 1500 : 5000);
}

function render() {
  const run = state.runs[0];
  document.getElementById("where").textContent = state.root;
  const status = document.getElementById("status");
  status.className = "badge" + (run && run.status === "running" ? " running" : "");
  status.textContent = !run ? "no runs yet" : run.status === "running"
    ? `run ${run.id}: parsing ${run.done} of ${run.total}` : `run ${run.id} finished ${fmtTime(run.finished)}`;
  const units = state.spec ? specUnits(state.spec).length : 0;
  const counts = { errors: state.causes.length, programs: state.programs.length, data: new Set(state.access.map(a => `${a.store}:${a.resource}`)).size, backlog: units };
  document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
    `<button class="${id === tab ? "active" : ""}" data-tab="${id}">${label}${counts[id] != null ? `<span class="count">${counts[id]}</span>` : ""}</button>`).join("");
  const main = document.getElementById("main");
  main.innerHTML = { progress, errors, programs, data, backlog }[tab]();
  if (tab === "programs") drawCallGraph();
}

function progress() {
  const files = state.files, run = state.runs[0] || {};
  const by = s => files.filter(f => f.status === s).length;
  const n = files.length || 1;
  const segs = ["clean", "errors", "crash", "parsing", "queued"].map(s => [s, by(s)]);
  const filtered = fileFilter === "all" ? files : files.filter(f => f.status === fileFilter);
  return `
  <div class="kpis">
    ${[["Files", files.length], ["Parsed", files.length - by("queued") - by("parsing")], ["Clean", by("clean")],
       ["With Errors", by("errors")], ["Crashed", by("crash")], ["Reused From Cache", run.cached || 0]]
      .map(([l, v]) => `<div class="kpi"><div class="value">${v}</div><div class="label">${l}</div></div>`).join("")}
  </div>
  <section class="card"><h2>Run ${run.id ?? ""}</h2>
    <div class="bar">${segs.map(([s, c]) => `<span style="width:${100 * c / n}%;background:${COLORS[s]}"></span>`).join("")}</div>
    <div class="legend">${segs.map(([s, c]) => `<span><span class="dot" style="background:${COLORS[s]}"></span>${s} ${c}</span>`).join("")}
      <span>started ${fmtTime(run.started)}</span>${run.finished ? `<span>took ${fmtDur(run.finished - run.started)}</span>` : ""}</div>
  </section>
  <div class="grid2">
    <section class="card"><h2>Count Check</h2>${checks()}</section>
    <section class="card"><h2>Runs</h2>
      <table><tr><th>Run</th><th>Started</th><th class="num">Files</th><th class="num">Clean</th><th class="num">Errors</th><th class="num">Crashed</th><th class="num">Cached</th><th></th></tr>
      ${state.runs.map(r => `<tr><td>${r.id}</td><td>${fmtTime(r.started)}</td><td class="num">${r.total}</td><td class="num">${r.clean || 0}</td>
        <td class="num">${r.errors || 0}</td><td class="num">${r.crash || 0}</td><td class="num">${r.cached || 0}</td>
        <td style="width:90px"><div class="bar" style="margin:6px 0">${["clean", "errors", "crash"].map(s => `<span style="width:${100 * (r[s] || 0) / (r.total || 1)}%;background:${COLORS[s]}"></span>`).join("")}</div></td></tr>`).join("")}
      </table></section>
  </div>
  <section class="card"><h2>Files</h2>
    <div class="filters">${["all", "clean", "errors", "crash", "parsing", "queued"].map(s =>
      `<button class="${fileFilter === s ? "on" : ""}" data-filter="${s}">${s} ${s === "all" ? files.length : by(s)}</button>`).join("")}</div>
    <table><tr><th>Status</th><th>File</th><th>Programs</th><th class="num">Errors</th><th class="num">Warnings</th><th class="num">Time</th></tr>
    ${filtered.map(f => `<tr><td><span class="chip ${f.status}">${f.status}</span></td><td class="mono">${esc(f.path)}${f.message ? `<div class="bad">${esc(f.message)}</div>` : ""}</td>
      <td>${f.programs.map(p => `<span class="link mono" data-program="${esc(p)}">${esc(p)}</span>`).join(" ")}</td>
      <td class="num">${f.errors ?? ""}</td><td class="num">${f.warnings ?? ""}</td><td class="num">${f.seconds ? f.seconds.toFixed(1) + " s" : ""}</td></tr>`).join("")}
    </table></section>`;
}

function checks() {
  if (!state.checks.length) return `<div class="muted">Runs with copybook folders compare statement counts with a text scan of the source.</div>`;
  const from = state.checks[0].run_id !== state.runs[0].id ? `<div class="muted" style="margin-bottom:6px">from run ${state.checks[0].run_id}</div>` : "";
  return `${from}<table><tr><th>Statement</th><th class="num">Text Scan</th><th class="num">Graph</th><th></th></tr>
  ${state.checks.map(c => `<tr><td>${esc(c.kind)}</td><td class="num">${c.text}</td><td class="num">${c.graph}</td>
    <td>${c.text === c.graph ? `<span class="ok">match</span>` : `<span class="bad">differs</span><div class="diffs">${Object.entries(c.differences).map(([p, [t, g]]) => `${esc(p)} ${t} vs ${g}`).join(", ")}</div>`}</td></tr>`).join("")}</table>`;
}

function errors() {
  if (!state.causes.length) return `<section class="card"><div class="empty">No errors in the latest run.</div></section>`;
  return `<section class="card"><h2>Errors by Cause</h2><table>
    <tr><th class="num">Count</th><th>Message</th><th>Code</th><th class="num">Files</th></tr>
    ${state.causes.map((c, i) => `<tr class="click" data-cause="${i}"><td class="num">${c.count}</td><td>${esc(c.message)}</td><td class="mono muted">${esc(c.code)}</td><td class="num">${c.files.length}</td></tr>
      ${openCause === i ? `<tr><td></td><td colspan="3">${c.where.map(w => where(w.path, w.abs, w.line)).join("<br>")}${c.count > c.where.length ? `<div class="muted">and ${c.count - c.where.length} more</div>` : ""}</td></tr>` : ""}`).join("")}
  </table></section>`;
}

function callEdges() {
  const names = new Set(state.programs.map(p => p.name));
  const edges = [];
  for (const c of state.calls) {
    const targets = c.target ? [c.target] : c.candidates;
    for (const t of targets) edges.push({ from: c.program, to: t, via: c.via, guess: !c.target, known: names.has(t) });
  }
  return edges;
}

function programs() {
  const unresolved = state.calls.filter(c => !c.target);
  return `<section class="card"><h2>Calls Between Programs</h2>
    <div class="filters"><button class="${showCandidates ? "on" : ""}" data-candidates>${showCandidates ? "Hide" : "Show"} Candidates for Unresolved Calls</button></div>
    <div class="legend" style="margin-bottom:8px"><span><span class="dot" style="background:var(--clean)"></span>clean</span>
      <span><span class="dot" style="background:var(--errors)"></span>with errors</span><span><span class="dot" style="background:var(--crash)"></span>crashed</span>
      <span><span class="dot" style="background:#fff;border:1px dashed #888"></span>not in the repository</span>
      <span>gray: CALL or LINK, blue: XCTL, dashed: a name the program MOVEs into an unresolved target. Hover a program to highlight its calls.</span></div>
    <div style="overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fcfcfb"><svg id="graph"></svg></div>
  </section>
  <div class="grid2">
  <section class="card"><h2>Programs</h2><table><tr><th>Program</th><th>Status</th><th class="num">Paragraphs</th><th class="num">Statements</th><th class="num">Data Items</th></tr>
    ${state.programs.map(p => `<tr class="click" data-program="${esc(p.name)}"><td class="mono">${esc(p.name)}</td><td><span class="chip ${p.status}">${p.status}</span></td>
      <td class="num">${p.paragraphs}</td><td class="num">${p.statements}</td><td class="num">${p.data_items}</td></tr>`).join("")}</table></section>
  <section class="card"><h2>Unresolved Calls (${unresolved.length})</h2><table><tr><th>From</th><th>Via</th><th>Expression</th><th>Candidates</th><th>Where</th></tr>
    ${unresolved.map(c => `<tr><td class="mono">${esc(c.program)}</td><td>${c.via}</td><td class="mono">${esc(c.expression)}</td><td class="mono">${esc(c.candidates.join(", ")) || `<span class="muted">none</span>`}</td><td>${where(c.path, c.abs, c.line)}</td></tr>`).join("")}</table></section>
  </div>`;
}

function drawCallGraph() {
  // Layered layout: column 0 holds programs no other program calls, column n the programs first
  // reached n calls away, then programs outside the repository, then programs with no calls.
  const svg = document.getElementById("graph");
  const status = Object.fromEntries(state.programs.map(p => [p.name, p.status]));
  const seen = new Map();
  for (const e of callEdges()) { const k = `${e.from}>${e.to}>${e.guess}`; if (!seen.has(k)) seen.set(k, e); }
  const edges = [...seen.values()].filter(e => e.from !== e.to && (showCandidates || !e.guess));
  const inRepo = n => status[n] != null;
  const linked = new Set(edges.flatMap(e => [e.from, e.to]));
  const incoming = new Set(edges.filter(e => inRepo(e.to)).map(e => e.to));
  const level = {};
  let frontier = state.programs.map(p => p.name).filter(n => linked.has(n) && !incoming.has(n));
  frontier.forEach(n => level[n] = 0);
  for (let depth = 1; frontier.length; depth++) {
    const next = [];
    for (const e of edges) if (frontier.includes(e.from) && inRepo(e.to) && level[e.to] == null) { level[e.to] = depth; next.push(e.to); }
    frontier = [...new Set(next)];
  }
  for (const n of linked) if (inRepo(n) && level[n] == null) level[n] = 0;  // cycles with no entry
  const depth = Math.max(0, ...Object.values(level));
  const columns = [];
  for (const [n, l] of Object.entries(level)) (columns[l] ||= []).push(n);
  const outside = [...linked].filter(n => !inRepo(n)).sort();
  const isolated = state.programs.map(p => p.name).filter(n => !linked.has(n));
  const titles = columns.map((_, i) => i === 0 ? "Not called" : `${i} call${i > 1 ? "s" : ""} away`);
  if (outside.length) { columns.push(outside); titles.push("Outside the repository"); }
  if (isolated.length) { columns.push(isolated); titles.push("No calls"); }
  columns.forEach(c => c.sort());
  const colW = 200, rowH = 26, top = 48, left = 24;
  const pos = {};
  columns.forEach((c, i) => c.forEach((n, j) => pos[n] = { x: left + i * colW, y: top + j * rowH }));
  const width = left * 2 + columns.length * colW, height = top + Math.max(...columns.map(c => c.length)) * rowH + 20;
  svg.setAttribute("width", width); svg.setAttribute("height", height);
  const path = e => { const a = pos[e.from], b = pos[e.to]; if (!a || !b) return "";
    const color = e.via === "XCTL" ? "var(--accent)" : "#777";
    const x1 = a.x + 16 + e.from.length * 7.3, x2 = b.x - 9, back = b.x <= a.x;  // leave the label clear
    const d = back ? `M${x1},${a.y} C${x1 + 60},${a.y - 40} ${x2 - 60},${b.y - 40} ${x2},${b.y}` : `M${x1},${a.y} C${(x1 + x2) / 2},${a.y} ${(x1 + x2) / 2},${b.y} ${x2},${b.y}`;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-opacity=".5" stroke-width="1.2" ${e.guess ? 'stroke-dasharray="4 3"' : ""} marker-end="url(#arrow)" data-from="${esc(e.from)}" data-to="${esc(e.to)}"><title>${esc(e.from)} ${e.via} ${esc(e.to)}${e.guess ? " (candidate)" : ""}</title></path>`; };
  const node = n => { const p = pos[n], s = status[n];
    return `<g ${s ? `data-program="${esc(n)}" style="cursor:pointer"` : ""} class="gnode" data-name="${esc(n)}"><circle cx="${p.x}" cy="${p.y}" r="6" fill="${s ? COLORS[s] || "#999" : "#fff"}" stroke="${s ? "#fff" : "#888"}" ${s ? "" : 'stroke-dasharray="2 2"'}/>
      <text x="${p.x + 11}" y="${p.y + 4}" fill="${s ? "#1d1d1b" : "#888"}">${esc(n)}</text></g>`; };
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#888"/></marker></defs>
    ${titles.map((t, i) => `<text x="${left + i * colW}" y="22" fill="#6b6b66" style="font:600 11px -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.04em">${esc(t)}</text>`).join("")}
    <g id="edges">${edges.map(path).join("")}</g>${Object.keys(pos).map(node).join("")}`;
  // Hovering a program highlights its calls.
  svg.querySelectorAll(".gnode").forEach(g => {
    g.addEventListener("mouseenter", () => svg.querySelectorAll("#edges path").forEach(p => {
      const on = p.dataset.from === g.dataset.name || p.dataset.to === g.dataset.name;
      p.setAttribute("stroke-opacity", on ? "1" : ".08"); p.setAttribute("stroke-width", on ? "2" : "1.2"); }));
    g.addEventListener("mouseleave", () => svg.querySelectorAll("#edges path").forEach(p => { p.setAttribute("stroke-opacity", ".5"); p.setAttribute("stroke-width", "1.2"); }));
  });
}

function data() {
  const stores = [...new Set(state.access.map(a => a.store))].sort();
  const rows = state.access.filter(a => storeFilter === "all" || a.store === storeFilter);
  const resources = [...new Set(rows.map(a => `${a.store}:${a.resource}`))].sort();
  const progs = [...new Set(rows.map(a => a.program))].sort();
  const cell = {};
  for (const a of rows) { const k = `${a.program}|${a.store}:${a.resource}`; (cell[k] ||= { r: false, w: false, rows: [] }); cell[k][a.mode === "read" ? "r" : "w"] = true; if (a.mode === "read-write") cell[k].r = true; cell[k].rows.push(a); }
  window._cells = cell;
  return `<section class="card"><h2>Reads and Writes</h2>
    <div class="filters">${["all", ...stores].map(s => `<button class="${storeFilter === s ? "on" : ""}" data-store="${s}">${s} ${s === "all" ? new Set(state.access.map(a => a.store + a.resource)).size : new Set(state.access.filter(a => a.store === s).map(a => a.resource)).size}</button>`).join("")}</div>
    <div class="legend" style="margin-bottom:8px"><span><span class="dot" style="background:#cfe5d6"></span>R read</span><span><span class="dot" style="background:#f2d39a"></span>W write</span><span><span class="dot" style="background:#ecb7aa"></span>RW both</span><span>Click a cell for the statements.</span></div>
    <div class="matrix"><table><tr><th></th>${resources.map(r => `<th class="col">${esc(r)}</th>`).join("")}</tr>
    ${progs.map(p => `<tr><td class="rowname"><span class="link" data-program="${esc(p)}">${esc(p)}</span></td>${resources.map(r => { const c = cell[`${p}|${r}`];
      if (!c) return "<td></td>"; const m = c.r && c.w ? "rw" : c.r ? "r" : "w";
      return `<td class="cell ${m}" data-cell="${esc(`${p}|${r}`)}">${m.toUpperCase()}</td>`; }).join("")}</tr>`).join("")}
    </table></div></section>
  <section class="card"><h2>Batch Files</h2><table><tr><th>Program</th><th>File</th><th>DD Name</th><th>Organization</th><th>Access</th><th>Where</th></tr>
    ${state.fileControls.map(f => `<tr><td class="mono">${esc(f.program)}</td><td class="mono">${esc(f.name)}</td><td class="mono">${esc(f.assign)}</td><td>${esc(f.organization)}</td><td>${esc(f.access_mode)}</td><td>${where(f.path, f.abs, f.line)}</td></tr>`).join("")}</table></section>`;
}

const pick = (o, ...keys) => { for (const k of keys) for (const key of Object.keys(o || {})) if (key.toLowerCase().replace(/[_\s-]/g, "") === k) return o[key]; };
const list = v => Array.isArray(v) ? v : v == null ? [] : [v];
const label = v => typeof v === "string" ? v : v && (pick(v, "id", "name", "unit", "resource", "table", "file", "to", "program") ?? JSON.stringify(v));
function specUnits(spec) { return list(pick(spec, "units", "backlog", "migrationunits")); }

function backlog() {
  if (state.specError) return `<section class="card"><div class="empty bad">Could not read ${esc(state.specPath)}: ${esc(state.specError)}</div></section>`;
  if (!state.spec) return `<section class="card"><div class="empty">No migration-spec.json yet. The backlog appears here once the agent records units in step 4.</div></section>`;
  const units = specUnits(state.spec);
  const waves = list(pick(state.spec, "waves"));
  const waveOf = {};
  waves.forEach((w, i) => list(pick(w, "units", "unitids") ?? w).forEach(u => waveOf[label(u)] = pick(w, "wave", "number", "id", "name") ?? i + 1));
  const groups = {};
  for (const u of units) { const id = label(u); const w = pick(u, "wave", "wavenumber") ?? waveOf[id] ?? "unassigned"; (groups[w] ||= []).push(u); }
  const questions = list(pick(state.spec, "openquestions", "questions"));
  const field = (u, name, ...keys) => { const v = list(pick(u, ...keys)); return v.length ? `<div class="row"><span class="muted">${name}:</span> ${v.map(x => esc(label(x))).join(", ")}</div>` : ""; };
  return `<section class="card"><h2>Backlog: ${units.length} Units</h2><div class="muted" style="margin-bottom:12px">from <span class="mono">${esc(state.specPath)}</span></div>
    ${Object.keys(groups).sort((a, b) => (isNaN(a) ? 1e9 : +a) - (isNaN(b) ? 1e9 : +b)).map(w => `<div class="wave"><h3>${isNaN(w) ? esc(w) : "Wave " + esc(w)}</h3><div class="units">
      ${groups[w].map(u => `<div class="unit"><div class="id">${esc(label(u))}</div><div class="name">${esc(pick(u, "name", "title") ?? "")}</div>
        ${field(u, "Programs", "programs")}${field(u, "Reads", "reads")}${field(u, "Writes", "writes")}${field(u, "Depends on", "dependencies", "dependson", "dependencieson")}
        ${field(u, "Entry points", "entrypoints")}</div>`).join("")}</div></div>`).join("")}
  </section>
  ${questions.length ? `<section class="card"><h2>Open Questions (${questions.length})</h2><table>${questions.map(q => `<tr><td>${esc(typeof q === "string" ? q : pick(q, "question", "text", "title") ?? JSON.stringify(q))}</td><td class="muted">${esc(typeof q === "object" ? pick(q, "default", "defaultassumption", "assumption") ?? "" : "")}</td></tr>`).join("")}</table></section>` : ""}`;
}

async function openProgram(name) {
  const drawer = document.getElementById("drawer");
  drawer.classList.add("open"); drawer.innerHTML = `<button class="close" data-close>×</button><h2>${esc(name)}</h2><div class="muted">loading</div>`;
  const res = await fetch("api/program?name=" + encodeURIComponent(name));
  if (!res.ok) { drawer.innerHTML += `<div class="bad">No graph for ${esc(name)}.</div>`; return; }
  const p = await res.json();
  const calls = state.calls.filter(c => c.program === name), access = state.access.filter(a => a.program === name);
  const item = i => { const meta = [i.pic && "PIC " + i.pic, i.usage && i.usage !== "UNDEFINED" && i.usage, i.occurs && `OCCURS ${i.occurs}`, i.redefines && `REDEFINES ${i.redefines}`, i.value && `VALUE ${i.value}`].filter(Boolean).join(" ");
    const head = `${String(i.level ?? "").padStart(2, "0")} ${esc(i.name)} <span class="muted">${esc(meta)}${i.copybook ? ` · ${esc(i.copybook)}` : ""} · ${i.references} refs</span>`;
    return i.children.length ? `<details><summary>${head}</summary>${i.children.map(item).join("")}</details>` : `<div class="leaf">${head}</div>`; };
  drawer.innerHTML = `<button class="close" data-close>×</button><h2 class="mono" style="margin:0">${esc(p.name)}</h2>
    <div class="muted mono" style="margin-bottom:12px">${where(p.file, p.abs, 1)}</div>
    <section class="card"><h2>Calls (${calls.length})</h2><table>${calls.map(c => `<tr><td>${c.via}</td><td class="mono">${esc(c.target || c.expression)}${c.target ? "" : ` <span class="muted">(${esc(c.candidates.join(", ") || "unresolved")})</span>`}</td><td class="mono muted">${esc(c.paragraph || "")}</td><td>${where(c.path, c.abs, c.line)}</td></tr>`).join("") || `<tr><td class="muted">none</td></tr>`}</table></section>
    <section class="card"><h2>Data Access (${access.length})</h2><table>${access.map(a => `<tr><td>${a.store}</td><td class="mono">${esc(a.resource)}</td><td>${a.mode}</td><td>${esc(a.verb)}</td><td class="mono muted">${esc(a.paragraph || "")}</td><td>${where(a.path, a.abs, a.line)}</td></tr>`).join("") || `<tr><td class="muted">none</td></tr>`}</table></section>
    <section class="card"><h2>Paragraphs (${p.paragraphs.length})</h2><table><tr><th>Paragraph</th><th class="num">Statements</th><th>Performs</th><th>Performed By</th></tr>
      ${p.paragraphs.map(x => `<tr><td>${x.at ? link(x.name, x.at.abs, x.at.line) : esc(x.name)}</td><td class="num">${x.statements}</td><td class="mono" style="font-size:12px">${esc(x.performs.join(", "))}</td><td class="mono" style="font-size:12px">${esc(x.performedBy.join(", "))}</td></tr>`).join("")}</table></section>
    <section class="card"><h2>Data Items</h2><div class="tree">${p.dataItems.map(item).join("")}</div></section>
    <section class="card"><h2>Copybooks</h2><div class="mono">${esc(p.copybooks.join(", "))}</div></section>`;
}

async function openSource(path, line) {
  const res = await fetch(`api/source?path=${encodeURIComponent(path)}&line=${line}`);
  const box = document.getElementById("modalBox");
  document.getElementById("modal").classList.add("open");
  if (!res.ok) { box.innerHTML = `<button class="close" data-close>×</button><div class="bad">Cannot show ${esc(path)}</div>`; return; }
  const s = await res.json();
  box.innerHTML = `<button class="close" data-close>×</button><div class="mono">${esc(s.path)}:${s.line}</div><pre class="source">${s.lines.map((l, i) => {
    const n = s.start + i; return `<span class="${n === s.line ? "hl" : ""}"><span class="ln">${n}</span>${esc(l) || " "}</span>`; }).join("")}</pre>`;
}

function showCell(key) {
  const c = window._cells[key]; if (!c) return;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modalBox").innerHTML = `<button class="close" data-close>×</button><h3 class="mono" style="margin:0 0 8px">${esc(key.replace("|", " → "))}</h3><table>
    ${c.rows.map(a => `<tr><td>${a.mode}</td><td>${esc(a.verb)}</td><td class="mono">${esc(a.paragraph || "")}</td><td class="mono muted">${esc(a.expression)}${a.resolved !== "literal" && a.resolved !== "declared" ? ` (${a.resolved})` : ""}</td><td>${where(a.path, a.abs, a.line)}</td></tr>`).join("")}</table>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-filter],[data-cause],[data-store],[data-program],[data-src],[data-cell],[data-close],[data-candidates]");
  if (!t) { if (e.target.id === "modal") e.target.classList.remove("open"); return; }
  const d = t.dataset;
  if (d.tab) { tab = d.tab; location.hash = tab; render(); }
  else if (d.filter) { fileFilter = d.filter; render(); }
  else if (d.cause != null) { openCause = openCause === +d.cause ? null : +d.cause; render(); }
  else if (d.store) { storeFilter = d.store; render(); }
  else if (d.program) openProgram(d.program);
  else if (d.src) openSource(d.src, d.line);
  else if (d.cell) showCell(d.cell);
  else if (d.candidates != null) { showCandidates = !showCandidates; render(); }
  else if (d.close != null) { t.closest(".drawer,.modal").classList.remove("open"); }
});
window.addEventListener("hashchange", () => { const next = location.hash.slice(1) || "progress"; if (next !== tab && state) { tab = next; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".open").forEach(x => x.classList.remove("open")); });
refresh();
</script>
</body>
</html>
