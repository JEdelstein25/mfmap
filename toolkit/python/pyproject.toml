[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cobolgraph"
version = "0.1.0"
description = "Typed COBOL program model over parsebol's `analysis --graph` output"
readme = "README.md"
license = { text = "EPL-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
cobolgraph = "cobolgraph.__main__:main"

[tool.setuptools]
packages = ["cobolgraph"]

[tool.setuptools.package-data]
cobolgraph = ["dashboard.html"]
