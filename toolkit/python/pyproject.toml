[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfmap"
version = "0.4.0"
description = "Typed COBOL program model over mfmap's `analysis --graph` output"
readme = "README.md"
license = { text = "EPL-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
mfmap = "mfmap.__main__:main"

[tool.setuptools]
packages = ["mfmap", "mfmap.resolvers"]

[tool.setuptools.package-data]
mfmap = ["page.html", "migration-v1.schema.json", "static/*"]
