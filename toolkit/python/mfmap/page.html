<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="stylesheet" href="static/map.css">
<style>
  body { margin: 0; background: #fbfbfa; color: #1d1d1b; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  article { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 26px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid #e6e5e1; }
  h3 { font-size: 15px; margin: 22px 0 6px; } h4 { font-size: 14px; margin: 14px 0 4px; color: #4a4a46; }
  ul, ol { padding-left: 22px; } li { margin: 3px 0; } li ul { margin: 2px 0; }
  nav { display: flex; gap: 4px; max-width: 860px; margin: 0 auto; padding: 0 24px; }
  nav a { padding: 10px 2px; margin-right: 16px; color: #6b6b66; border-bottom: 2px solid transparent; }
  nav a.on { color: #1d1d1b; border-bottom-color: #1d1d1b; } nav a:hover { text-decoration: none; color: #1d1d1b; }
  header { border-bottom: 1px solid #e6e5e1; background: #fbfbfa; position: sticky; top: 0; }
  code, pre { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code { background: #f0efeb; padding: 1px 4px; border-radius: 4px; }
  pre { background: #f0efeb; padding: 10px 12px; border-radius: 6px; overflow: auto; }
  pre code { background: none; padding: 0; }
  a, .src { color: #3a5bd9; text-decoration: none; cursor: pointer; } a:hover, .src:hover { text-decoration: underline; }
  .src { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #status { font-size: 12px; color: #8a8984; padding: 4px 24px 0; max-width: 860px; margin: 0 auto; }
  #status.running::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #3a5bd9; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .modal { position: fixed; inset: 0; background: rgba(20,20,18,.35); display: none; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .box { background: #fff; border-radius: 8px; width: min(900px, 94vw); max-height: 84vh; overflow: auto; padding: 14px 18px; }
  .box pre { background: none; padding: 0; } .box pre > span { display: block; } .box .hl { background: #fff2b8; }
  .box .ln { color: #8a8984; display: inline-block; width: 4.5em; user-select: none; }
  .intro { color: #4a4a46; margin: 4px 0 18px; }
  .q { border: 1px solid #e6e5e1; border-radius: 8px; background: #fff; padding: 14px 16px; margin: 12px 0; }
  .q.answered { background: #f6f6f3; }
  .q .head { display: flex; gap: 10px; align-items: baseline; }
  .q .id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a8984; flex: none; }
  .q .text { font-weight: 600; }
  .q .tag { margin-left: auto; flex: none; font-size: 12px; color: #8a8984; }
  .q dl { display: grid; grid-template-columns: 7em 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 14px; }
  .q dt { color: #8a8984; } .q dd { margin: 0; }
  .q form { display: flex; gap: 8px; margin-top: 12px; align-items: flex-start; }
  .q textarea { flex: 1; min-height: 38px; resize: vertical; font: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid #d9d8d3; border-radius: 6px; background: #fff; }
  .q textarea:focus { outline: 2px solid #c9d3f7; border-color: #3a5bd9; }
  .q button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; border: 1px solid #1d1d1b; background: #1d1d1b; color: #fff; cursor: pointer; }
  .q button.plain { background: none; color: #3a5bd9; border: 0; padding: 0; font-size: 13px; }
  .q .answer { margin-top: 10px; font-size: 14px; } .q .answer strong { color: #2f7a3d; font-weight: 600; }
  .empty { color: #8a8984; font-style: italic; }
  .close { float: right; border: 0; background: none; font-size: 20px; cursor: pointer; color: #8a8984; }
  /* The Map tab fills the window under the header; its canvas is the bundle in static/. */
  #map { display: none; height: calc(100vh - var(--head, 64px)); }
  body.map #map { display: block; } body.map article { display: none; } body.map { overflow: hidden; }
  body.map nav, body.map #status { max-width: none; }
  .modal { z-index: 50; }
</style>
</head>
<body>
<header><div id="status">loading</div><nav><a href="#" data-tab="notes">Notes</a><a href="#parser" data-tab="parser">Parser</a><a href="#backlog" data-tab="backlog">Backlog</a><a href="#map" data-tab="map">Map</a></nav></header>
<article id="page"></article>
<div id="map"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let root = "", data = null, shown = "";
const tab = () => location.hash.startsWith("#map") ? "map" : ({ "#backlog": "backlog", "#parser": "parser" })[location.hash] || "notes";
// Answers being typed, by question ID, so a refresh does not lose them.
const drafts = {}, editing = new Set();

// Inline Markdown, plus file:line references to COBOL sources, which open the source.
function inline(text) {
  const code = [];
  let s = esc(text).replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)_(.+?)_(?=\W|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/([\w./@-]+\.(?:cbl|cob|cpy|dcl|CBL|COB|CPY|DCL)):(\d+)/g, (m, p, l) =>
      `<span class="src" data-path="${esc(p.startsWith("/") ? p : root + "/" + p)}" data-line="${l}">${m}</span>`);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[i]}</code>`);
}

function markdown(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const body = []; while (++i < lines.length && !lines[i].startsWith("```")) body.push(lines[i]);
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
    } else if (/^#{1,4} /.test(line)) {
      const n = line.match(/^#+/)[0].length; out.push(`<h${n}>${inline(line.slice(n + 1))}</h${n}>`);
    } else if (/^\s*([-*]|\d+\.) /.test(line)) {
      // One level of nesting: items indented by two or more spaces belong to the item above.
      const ordered = /^\s*\d+\./.test(line), items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i]); i++) {
        const text = lines[i].replace(/^\s*([-*]|\d+\.) /, "");
        if (/^\s{2,}/.test(lines[i]) && items.length) items[items.length - 1].children.push(text);
        else items.push({ text, children: [] });
      }
      i--; out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x.text)}${x.children.length
        ? `<ul>${x.children.map(c => `<li>${inline(c)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (line.trim()) {
      const para = [line]; while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|```|\s*([-*]|\d+\.) )/.test(lines[i + 1])) para.push(lines[++i]);
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}

async function refresh() {
  let running = false;
  try {
    data = await (await fetch("api/report")).json();
    root = data.root; running = data.run && data.run.status === "running";
    const status = document.getElementById("status");
    status.className = running ? "running" : "";
    status.textContent = (running ? "Parsing. " : "") + "Updated " + new Date().toLocaleTimeString();
    show();
  } catch (e) { document.getElementById("status").textContent = "Disconnected; retrying"; }
  setTimeout(refresh, running ? 1500 : 4000);
}

function question(q) {
  const rows = [["Found", q.found], ["Default", q.default], ["Affects", q.affects]].filter(([, v]) => v);
  const form = !q.answer || editing.has(q.id);
  return `<section class="q${q.answer ? " answered" : ""}" data-id="${esc(q.id)}">
    <div class="head"><span class="id">${esc(q.id)}</span><span class="text">${inline(q.question)}</span>
      <span class="tag">${q.answer ? "answered" + (q.by === "page" ? " here" : "") : "open"}</span></div>
    ${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${inline(v)}</dd>`).join("")}</dl>` : ""}
    ${form ? `<form><textarea name="answer" placeholder="Your answer">${esc(drafts[q.id] ?? q.answer ?? "")}</textarea><button>Save</button></form>`
      : `<div class="answer"><strong>Answer:</strong> ${inline(q.answer)} <button class="plain" data-edit>Change</button></div>`}
  </section>`;
}

function notesPage() {
  const qs = data.questions || [], open = qs.filter(q => !q.answer);
  const list = [...open, ...qs.filter(q => q.answer)];
  return `<h1>Notes</h1><p><code>${esc(root)}</code></p><h2>Open Questions</h2>` + (qs.length
    ? `<p class="intro">${open.length} open, ${qs.length - open.length} answered. None of these block the work: the agent goes ahead with the default for each one. Answer any of them to change the plan.</p>${list.map(question).join("")}`
    : `<p class="empty">No questions yet. The agent adds them here as it finds things the source cannot answer.</p>`)
    + markdown(data.notes);
}

// The Map tab draws itself (static/map.js) and polls api/graph; this only shows it and lends it the
// source viewer.
function showMap(on) {
  document.body.classList.toggle("map", on);
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab()));
  if (!on) return;
  document.body.style.setProperty("--head", document.querySelector("header").offsetHeight + "px");
  const el = document.getElementById("map");
  if (!window.MfmapMap) { el.textContent = "Loading the map (static/map.js)."; return; }
  if (!el.dataset.mounted) { el.textContent = ""; el.dataset.mounted = "1"; window.MfmapMap.open(el, { openSource }); }
}

function show() {
  showMap(tab() === "map");
  if (!data || tab() === "map") return;
  const t = tab();
  const html = t === "backlog" ? markdown(data.backlog) : t === "parser" ? markdown(data.parser) : notesPage();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
  // Leave the page alone while an answer form has focus, so typing or saving is not interrupted.
  if (html !== shown && !document.activeElement?.closest(".q form")) { shown = html; document.getElementById("page").innerHTML = html; }
}

document.addEventListener("input", e => { const q = e.target.closest(".q"); if (q) drafts[q.dataset.id] = e.target.value; });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const q = e.target.closest(".q"), id = q.dataset.id, button = e.target.querySelector("button");
  button.disabled = true; button.textContent = "Saving";
  const res = await fetch("api/answer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, answer: e.target.answer.value }) });
  if (!res.ok) { button.disabled = false; button.textContent = "Save"; return; }
  const saved = await res.json();
  delete drafts[id]; editing.delete(id);
  data.questions = data.questions.map(x => x.id === id ? saved : x);
  document.activeElement?.blur(); shown = ""; show();
});
window.addEventListener("hashchange", () => { shown = ""; show(); if (tab() !== "map") window.scrollTo(0, 0); });

document.addEventListener("click", async e => {
  if (e.target.closest("[data-edit]")) { editing.add(e.target.closest(".q").dataset.id); shown = ""; show(); return; }
  const src = e.target.closest(".src");
  const modal = document.getElementById("modal");
  if (e.target.closest(".modal .close") || e.target === modal) { modal.classList.remove("open"); return; }
  if (src) openSource(src.dataset.path, src.dataset.line);
});

async function openSource(path, line) {
  const modal = document.getElementById("modal"), box = document.getElementById("box");
  const res = await fetch(`api/source?path=${encodeURIComponent(path)}&line=${line || 1}`);
  modal.classList.add("open");
  if (!res.ok) { box.innerHTML = `<button class="close">×</button>Cannot show ${esc(path)}`; return; }
  const s = await res.json();
  box.innerHTML = `<button class="close">×</button><code>${esc(s.path)}:${s.line}</code><pre>${s.lines.map((l, i) =>
    `<span class="${s.start + i === s.line ? "hl" : ""}"><span class="ln">${s.start + i}</span>${esc(l) || " "}</span>`).join("")}</pre>`;
  box.querySelector(".hl")?.scrollIntoView({ block: "center" });
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("modal").classList.remove("open"); });
refresh();
</script>
<script src="static/map.js"></script>
<script>if (tab() === "map") show();</script>
</body>
</html>
